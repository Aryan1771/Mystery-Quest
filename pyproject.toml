[project]
name = "mystery-quest"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "Django>=6.0,<6.1",
    "django-libsql-backend>=0.1.3,<0.2",
    "reportlab>=4.0.0,<6.0.0",
    "Pillow>=10.0.0",
    "asgiref>=3.8.0",
    "sqlparse>=0.5.0",
    "tzdata>=2024.1",
]

[tool.vercel.scripts]
# Run safe, additive Django schema migrations against the deployment database.
build = "python manage.py migrate --noinput --fake-initial"
